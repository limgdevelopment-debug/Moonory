<script type="module">
  import SwissEph from 'https://cdn.jsdelivr.net/gh/prolaxu/swisseph-wasm@main/src/swisseph.js';

  // 1. Инициализируем Swiss Ephemeris
  const swe = new SwissEph();
  await swe.initSwissEph(); // без этого ничего не считается

  // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

  // Перевод времени пользователя в UTC-часы
  function toUtcHour(localHour, localMinute, tzOffset) {
    // tzOffset — это число из селекта UTC+5 → 5, UTC+6 → 6 и т.д.
    const local = localHour + localMinute / 60;
    const utc = local - tzOffset;
    return utc; // может быть типа 3.75
  }

  // Получить юлианскую дату через SwissEph
  function getJulianDay(year, month, day, utcHour) {
    // month — 1..12, utcHour — десятичные часы
    return swe.julday(year, month, day, utcHour);
  }

  // Разбить долготу 0–360 на знак и градусы в знаке
  function splitZodiac(longitude) {
    const signs = [
      'Овен','Телец','Близнецы','Рак','Лев','Дева',
      'Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'
    ];
    let lon = longitude % 360;
    if (lon < 0) lon += 360;

    const signIndex = Math.floor(lon / 30);
    const degInSign = lon - signIndex * 30;

    return {
      sign: signs[signIndex],
      degrees: Math.floor(degInSign),
      minutes: Math.floor((degInSign - Math.floor(degInSign)) * 60)
    };
  }

  // ========== ГЛАВНАЯ ФУНКЦИЯ РАСЧЁТА КАРТЫ ==========

  async function calculateChart() {
    // 1. Считываем данные из формы
    const dateInput = document.getElementById('birth-date').value;   // формат yyyy-mm-dd
    const timeInput = document.getElementById('birth-time').value;   // формат hh:mm
    const city      = document.getElementById('city-input').value;
    const lat       = parseFloat(document.getElementById('latitude-input').value);
    const lon       = parseFloat(document.getElementById('longitude-input').value);
    const tzOffset  = parseFloat(document.getElementById('timezone-select').value); // например 5

    if (!dateInput || !timeInput || isNaN(lat) || isNaN(lon)) {
      alert('Пожалуйста, заполните дату, время и координаты.');
      return;
    }

    const [year, month, day] = dateInput.split('-').map(Number);
    const [hour, minute]     = timeInput.split(':').map(Number);

    // 2. Переводим в UTC и JD
    const utcHour = toUtcHour(hour, minute, tzOffset);
    const jd      = getJulianDay(year, month, day, utcHour);

    // 3. Считаем позиции планет (Солнце, Луна, Меркурий…)
    const planetDefs = [
      { id: 'sun',   name: 'Солнце', constId: swe.SE_SUN    },
      { id: 'moon',  name: 'Луна',   constId: swe.SE_MOON   },
      { id: 'merc',  name: 'Меркурий', constId: swe.SE_MERCURY },
      { id: 'ven',   name: 'Венера', constId: swe.SE_VENUS  },
      { id: 'mars',  name: 'Марс',   constId: swe.SE_MARS   },
      { id: 'jup',   name: 'Юпитер', constId: swe.SE_JUPITER},
      { id: 'sat',   name: 'Сатурн', constId: swe.SE_SATURN },
      { id: 'ura',   name: 'Уран',   constId: swe.SE_URANUS },
      { id: 'nep',   name: 'Нептун', constId: swe.SE_NEPTUNE},
      { id: 'plu',   name: 'Плутон', constId: swe.SE_PLUTO  }
    ];

    const planets = [];

    for (const p of planetDefs) {
      // calc_ut(JD, тело, флаги) → массив, где [0] — эклиптическая долгота
      const result = swe.calc_ut(jd, p.constId, swe.SEFLG_SWIEPH);
      const lonDeg = result[0]; // 0..360°
      const pos    = splitZodiac(lonDeg);

      planets.push({
        id: p.id,
        name: p.name,
        longitude: lonDeg,
        sign: pos.sign,
        deg: pos.degrees,
        min: pos.minutes
      });
    }

    // 4. Дома Placidus через SwissEph
    // В swisseph обычно есть функция houses / houses_ex.
    // В этой библиотеке API почти такой же, но имя может отличаться.
    // Ниже — логика, а точное имя при необходимости можно посмотреть в документации.

    let housesResult;
    if (typeof swe.houses === 'function') {
      housesResult = swe.houses(jd, lat, lon, 'P');       // Placidus
    } else if (typeof swe.houses_ex === 'function') {
      housesResult = swe.houses_ex(jd, lat, lon, 'P');    // альтернативное имя
    }

    let houseCusps = null;
    let asc = null;
    let mc  = null;

    if (housesResult) {
      // структура такая же, как в оригинальном Swiss Ephemeris:
      // housesResult.cusps[1..12], housesResult.ascmc[0] = Asc, [1] = MC
      houseCusps = housesResult.cusps;     // массив из 13 элементов: [0] пусто, [1]..[12]
      asc        = housesResult.ascmc[0];
      mc         = housesResult.ascmc[1];
    }

    // 5. Раскладываем планеты по домам
    function findHouseFor(longitude) {
      if (!houseCusps) return null;

      let lon = longitude % 360;
      if (lon < 0) lon += 360;

      // простой проход по куспидам Placidus по кругу
      for (let i = 1; i <= 12; i++) {
        const cusp1 = houseCusps[i];
        const cusp2 = (i === 12) ? houseCusps[1] + 360 : houseCusps[i + 1];

        let c1 = cusp1;
        let c2 = cusp2;
        if (c2 < c1) c2 += 360; // переход через 0°

        let l = lon;
        if (l < c1) l += 360;

        if (l >= c1 && l < c2) return i;
      }
      return null;
    }

    planets.forEach(p => {
      p.house = findHouseFor(p.longitude);
    });

    // 6. Считаем аспекты (пример: соединение, тригон, квадрат, оппозиция)
    const aspectTypes = [
      { name: 'Соединение', angle: 0,   orb: 8 },
      { name: 'Секстиль',   angle: 60,  orb: 4 },
      { name: 'Квадрат',    angle: 90,  orb: 6 },
      { name: 'Тригон',     angle: 120, orb: 6 },
      { name: 'Оппозиция',  angle: 180, orb: 8 }
    ];

    const aspects = [];

    for (let i = 0; i < planets.length; i++) {
      for (let j = i + 1; j < planets.length; j++) {
        const p1 = planets[i];
        const p2 = planets[j];

        let diff = Math.abs(p1.longitude - p2.longitude);
        if (diff > 180) diff = 360 - diff;

        for (const a of aspectTypes) {
          const delta = Math.abs(diff - a.angle);
          if (delta <= a.orb) {
            aspects.push({
              between: `${p1.name} — ${p2.name}`,
              type: a.name,
              orb: delta.toFixed(2)
            });
            break;
          }
        }
      }
    }

    // 7. Здесь обновляем интерфейс (таблицы, текст, круг)
    //    Ты уже делал вывод позиций — туда просто подставляем новые данные из planets / aspects / houseCusps.
    console.log({ jd, planets, asc, mc, houseCusps, aspects });
  }

  // вешаем функцию на кнопку
  document
    .getElementById('calculate-button')
    .addEventListener('click', () => { calculateChart().catch(console.error); });
</script>
