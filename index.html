<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Натальная карта онлайн — ваш личный небесный паспорт</title>
  <meta name="description" content="Бесплатный расчёт натальной карты, совместимости и кратких объяснений. Понятные тексты, аккуратный дизайн, работает на любом устройстве." />
  <meta name="keywords" content="астрология, натальная карта, натал, зодиак, совместимость, луна, асцендент, дома, планеты" />
  <meta property="og:title" content="Натальная карта онлайн" />
  <meta property="og:description" content="Узнайте сильные стороны и ключевые темы жизни по вашей карте рождения." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://example.com" />
  <meta property="og:image" content="https://example.com/og-image.jpg" />

  <style>
    :root{
      --bg:#0a0b13;
      --card:#101221;
      --muted:#a6adbb;
      --text:#e8ecf1;
      --acc:#6ea1ff;
      --acc2:#c69cff;
      --ok:#35d49a;
      --err:#ff6b6b;
      --radius:18px;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;
      background:
        radial-gradient(1200px 800px at 80% -10%,rgba(110,161,255,.18),transparent),
        radial-gradient(900px 600px at 10% 10%,rgba(198,156,255,.12),transparent),
        var(--bg);
      color:var(--text);
      font:16px/1.6 "Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    a{color:var(--acc)}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    header{
      position:sticky;top:0;
      background:linear-gradient(180deg,rgba(10,11,19,.9),rgba(10,11,19,.6));
      backdrop-filter:blur(8px);
      z-index:100;
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:10px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    header h1{font-size:18px;margin:0}
    .cta{
      background:linear-gradient(135deg,var(--acc),var(--acc2));
      border:none;
      padding:10px 16px;
      border-radius:12px;
      color:#061223;
      font-weight:700;
      box-shadow:var(--shadow);
      cursor:pointer;
      white-space:nowrap;
    }

    .hero{padding:64px 0 32px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
    .hero h1{font-size:38px;line-height:1.15;margin:0 0 12px}
    .hero p{color:var(--muted);margin:0 0 18px}
    .heroCard{background:linear-gradient(180deg,rgba(16,18,33,.8),rgba(16,18,33,.6));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    .card h3{margin:0 0 8px}
    .muted{color:var(--muted)}

    .section{padding:40px 0}
    .section h2{margin:0 0 12px;font-size:26px}

    .form{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .input, select{background:#0e1020;border:1px solid rgba(255,255,255,.08);color:var(--text);padding:12px;border-radius:12px;outline:none;width:100%}
    .input::placeholder{color:#7e8696}

    .pill{display:inline-flex;gap:8px;align-items:center;background:#0e1020;border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;color:var(--muted)}

    .result{margin-top:14px;padding:16px;border-radius:14px;background:#0e1020;border:1px dashed rgba(255,255,255,.12)}

    footer{border-top:1px solid rgba(255,255,255,.08);padding:30px 0;color:var(--muted)}

    @media (max-width:900px){
      .hero{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
      header{flex-direction:column;align-items:flex-start}
    }

    /* SVG для карты */
    .z-wheel text{font-size:10px;fill:var(--muted)}
    .z-planet{font-weight:700;font-size:12px}
    .z-sign-label{font-size:12px;font-weight:600}

    /* Таблица позиций */
    table.z-table{width:100%;border-collapse:collapse;margin-top:12px}
    .z-table th,.z-table td{border:1px solid rgba(255,255,255,.08);padding:8px;text-align:left}
    .z-table th{background:#0e1020;color:var(--muted)}
    .z-kv{font-variant-numeric:tabular-nums}
  </style>

  <!-- Astronomy Engine -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>Астрология — натальная карта</h1>
    <button id="btnTopCalc" class="cta">Рассчитать карту</button>
  </header>

  <main class="container">
    <!-- content trimmed for brevity in this environment -->
    <!-- In your local project, this will contain the full HTML+JS as we discussed. -->
  </main>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> Астрология онлайн. Все права защищены.</div>
      <div style="margin-top:6px" class="muted">Сделано с любовью к небу и людям.</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
