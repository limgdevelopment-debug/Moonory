<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moonory — Профессиональный расчет натальной карты</title>
  <style>
    :root{
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --radius: 8px;
      --separator: #21262d;
    }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.7;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px; margin-bottom: 25px;
      display: flex; align-items: center; justify-content: space-between;
    }
    h1 { margin: 0; font-size: 22px; color: var(--text-main); letter-spacing: -0.5px; }
    
    .calculator-panel {
      background-color: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .form-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 140px; position: relative; }

    .form-group label {
      display: block; color: var(--text-muted);
      margin-bottom: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%; background-color: var(--bg);
      border: 1px solid var(--border); color: var(--text-main);
      padding: 10px 12px; border-radius: var(--radius);
      font-size: 14px; box-sizing: border-box; transition: 0.2s;
    }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1); }

    /* Search Styles */
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #1c2128; border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      max-height: 200px; overflow-y: auto; z-index: 1000;
      display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .search-item {
      padding: 12px 15px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px; color: var(--text-main);
    }
    .search-item:hover { background-color: rgba(88, 166, 255, 0.15); color: #fff; }

    button.btn-submit {
      background: linear-gradient(180deg, #238636 0%, #2ea043 100%); 
      color: white; border: 1px solid rgba(240,246,252,0.1);
      padding: 12px 24px; font-size: 16px; font-weight: 600;
      border-radius: var(--radius); cursor: pointer; width: 100%; margin-top: 10px;
      transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    button.btn-submit:hover { filter: brightness(1.1); }

    /* Results Area */
    #results-area { display: none; margin-top: 40px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .angles-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 15px; margin-bottom: 25px;
    }
    .angle-card {
      background: rgba(56,139,253,0.05); border: 1px solid rgba(56,139,253,0.2);
      padding: 15px; border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .angle-label { font-weight: bold; color: var(--accent); font-size: 11px; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px;}
    .angle-val { font-size: 18px; font-weight: 700; color: #fff; }

    .astro-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background-color: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 30px;
    }
    .astro-table th, .astro-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
    .astro-table th { background-color: #1e262f; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .astro-table tr:last-child td { border-bottom: none; }
    .astro-table tr:hover { background-color: rgba(255,255,255,0.02); }
    
    .planet-icon { font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
    .house-header { 
      background: transparent; color: var(--text-main); 
      font-weight: bold; padding-bottom: 10px; margin-bottom: 15px; margin-top: 40px;
      font-size: 16px; border-bottom: 2px solid var(--border); 
      display: flex; align-items: center; justify-content: space-between;
    }
    
    /* Interpretations */
    .interp-section { margin-top: 60px; }
    .interp-group-title {
      font-size: 22px; color: var(--accent); border-bottom: 1px solid var(--border);
      padding-bottom: 12px; margin-bottom: 30px; margin-top: 50px; font-weight: 400; letter-spacing: -0.5px;
    }
    .interp-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 30px; margin-bottom: 30px;
      position: relative; overflow: hidden;
    }
    .interp-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--accent); opacity: 0.6;
    }
    .interp-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .interp-title { font-weight: 700; font-size: 20px; color: #fff; }
    .interp-badge {
      background: rgba(88, 166, 255, 0.1); color: var(--accent); border: 1px solid rgba(88, 166, 255, 0.2);
      padding: 4px 10px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
    }
    .interp-text { 
      color: #e6edf3; font-size: 16px; line-height: 1.8; 
      margin-bottom: 0; text-align: justify;
    }
    .interp-house-block {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 20px; margin-top: 25px;
    }
    .interp-house-title {
      font-size: 14px; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    }

    @media (max-width: 600px) { .form-row { flex-direction: column; gap: 15px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width: 32px; height: 32px; background: var(--accent); border-radius: 50%; display:flex; align-items:center; justify-content:center; color: #0d1117;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </div>
      <h1>Moonory <span style="font-weight:300; opacity:0.7">Astro</span></h1>
    </div>
    <div style="font-size:12px; color:var(--text-muted); border:1px solid var(--border); padding: 4px 8px; border-radius: 20px;">v8.1 Auto-Timezone</div>
  </header>

  <div class="calculator-panel">
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>Имя</label>
        <input type="text" id="userName" class="form-control" placeholder="Ваше имя" value="Гость">
      </div>
      <div class="form-group">
        <label>Дата</label>
        <input type="date" id="birthDate" class="form-control" value="2000-01-01" onchange="updateTimezoneIfPossible()">
      </div>
      <div class="form-group">
        <label>Время</label>
        <input type="time" id="birthTime" class="form-control" value="12:00">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label>Город (Поиск)</label>
        <input type="text" id="citySearch" class="form-control" placeholder="Введите город..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>
      
      <div class="form-group">
        <label>Широта (N)</label>
        <input type="number" id="lat" class="form-control" placeholder="55.75" value="55.75" step="0.0001">
      </div>
      <div class="form-group">
        <label>Долгота (E)</label>
        <input type="number" id="lng" class="form-control" placeholder="37.61" value="37.61" step="0.0001">
      </div>
      
      <div class="form-group">
        <label>Часовой пояс (UTC)</label>
        <input type="number" id="utcOffset" class="form-control" placeholder="Авто" step="0.5">
        <div id="tzInfo" style="font-size: 11px; color: var(--accent); margin-top: 4px; display: none;"></div>
      </div>
    </div>

    <button class="btn-submit" onclick="calculateChart()">Рассчитать карту</button>
  </div>

  <div id="results-area">
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:15px;">
      <h2 style="margin:0;">Натальная карта: <span id="resName" style="color:var(--accent)"></span></h2>
      <span style="font-size:12px; color:var(--text-muted)">Placidus • Deep Analysis</span>
    </div>

    <div class="angles-grid">
      <div class="angle-card">
        <span class="angle-label">ASC (Асцендент)</span>
        <span class="angle-val" id="ascResult">-</span>
      </div>
      <div class="angle-card">
        <span class="angle-label">MC (Зенит)</span>
        <span class="angle-val" id="mcResult">-</span>
      </div>
    </div>

    <h3 class="house-header">1. Координаты планет и Дома</h3>
    <table class="astro-table">
      <thead>
        <tr>
          <th>Планета</th>
          <th>Знак</th>
          <th>Градус</th>
          <th>R</th>
          <th>Дом</th>
        </tr>
      </thead>
      <tbody id="planetsBody"></tbody>
    </table>

    <h3 class="house-header">2. Вершины домов (Куспиды)</h3>
    <table class="astro-table">
      <thead>
        <tr>
            <th width="15%">Дом</th>
            <th width="35%">Знак</th>
            <th>Градус</th>
        </tr>
      </thead>
      <tbody id="housesBody"></tbody>
    </table>

    <div class="interp-section">
      <div class="interp-group-title">Анализ Личности (Big Three)</div>
      <div id="interp-angles"></div>

      <div class="interp-group-title">Планетарные Влияния</div>
      <div id="interp-planets"></div>
    </div>
  </div>
</div>

<script>
  // ============================================
  // === БАЗА ДАННЫХ (SMART GENERATOR) ===
  // ============================================
  
  const ARCHETYPES = {
    planets: {
        "Sun": { name: "Солнце", role: "центр личности и жизненной силы", action: "светить и созидать", focus: "самовыражение" },

        "Neptune": { name: "Нептун", role: "сферу грез и интуиции", action: "мечтать и растворять", focus: "духовность" },
        "Pluto": { name: "Плутон", role: "мощь трансформации", action: "влиять и перерождаться", focus: "власть" }
    },
    signs: {

        "Телец": { nature: "устойчивый", quality: "через надежность и комфорт", element: "earth" },
        "Близнецы": { nature: "подвижный", quality: "через общение и интеллект", element: "air" },
        "Рак": { nature: "чувствительный", quality: "через заботу и эмоции", element: "water" },

        "Весы": { nature: "дипломатичный", quality: "через партнерство и баланс", element: "air" },
        "Скорпион": { nature: "интенсивный", quality: "через глубину и силу воли", element: "water" },
        "Стрелец": { nature: "оптимистичный", quality: "через экспансию и знания", element: "fire" },
        "Козерог": { nature: "целеустремленный", quality: "через карьеру и структуру", element: "earth" },
        "Водолей": { nature: "оригинальный", quality: "через свободу и новизну", element: "air" },
        "Рыбы": { nature: "интуитивный", quality: "через эмпатию и воображение", element: "water" }
    },
    elements: {
        "fire": "Огненная стихия добавляет энтузиазма, динамики и желания быть заметным. Это положение требует активного внешнего проявления.",
        "earth": "Земная стихия придает действиям конкретность, практичность и нацеленность на реальный результат. Важна надежность.",
        "air": "Воздушная стихия подчеркивает важность идей, коммуникации и социального взаимодействия. Интеллект играет ключевую роль.",
        "water": "Водная стихия указывает на глубокую эмоциональную вовлеченность, интуитивное восприятие и скрытые мотивы."
    }
  };

  // 2. РУЧНАЯ БАЗА (Асцендент, Солнце, Луна)
  const MANUAL_DB = {
    asc: {
       "Овен": "Асцендент в Овне наделяет вас неукротимой энергией, жаждой действий и врожденными лидерскими качествами. Вы воспринимаете мир как поле для соревнования, где нужно быть первым, смелым и решительным. Окружающие видят в вас человека прямого, искреннего и порой даже резкого, но всегда готового прийти на помощь делом. Ваша реакция на любые жизненные вызовы мгновенна: вы сначала действуете, а потом думаете, что часто помогает вам выигрывать в спринте. Вы не любите ждать и терпеть ограничения, стремясь прокладывать свой собственный путь, невзирая на препятствия.",
       "Телец": "Восходящий Телец наделяет вашу личность фундаментальным спокойствием, надежностью и огромным запасом терпения. При первом знакомстве вы производите впечатление человека основательного, уравновешенного и знающего себе цену. Вы никуда не спешите, предпочитая действовать обдуманно и планомерно, что вызывает у окружающих чувство безопасности и доверия. Ваша связь с материальным миром очень сильна: вы цените комфорт, качественные вещи, вкусную еду и красоту во всех её проявлениях.",
       "Близнецы": "С Асцендентом в Близнецах вы выглядите вечно молодым, подвижным и открытым ко всему новому. Ваше главное оружие при взаимодействии с миром — это интеллект, коммуникация и любознательность. Вы производите впечатление человека, который знает все обо всем и может найти общий язык с кем угодно. Ваша мимика живая, жесты быстры, а глаза всегда ищут новую информацию или собеседника. Иногда вы можете казаться окружающим немного поверхностным из-за постоянной ментальной активности.",
       "Рак": "Вы производите впечатление мягкого, чувствительного и заботливого человека, вызывающего желание вас защитить. В незнакомой обстановке вы склонны проявлять осторожность, словно прячетесь в невидимый панцирь, прежде чем довериться. Окружающие считывают вашу эмпатию и интуитивно тянутся к вам за душевным теплом и поддержкой. Ваше настроение очень переменчиво и зависит от атмосферы вокруг, что отражается на вашем лице и поведении.",
       "Лев": "Асцендент во Льве наделяет вас королевской осанкой, чувством собственного достоинства и яркой харизмой. Вы входите в комнату так, словно выходите на сцену, и неосознанно ожидаете внимания и аплодисментов. Окружающие воспринимают вас как уверенного, творческого и щедрого человека, излучающего тепло и свет. Ваша гордость и потребность в признании являются главными двигателями вашего самовыражения. Вы не любите мелочности и суеты, предпочитая действовать с размахом.",
       "Дева": "Вы производите впечатление скромного, аккуратного и очень компетентного человека, который замечает все детали. Ваш взгляд на мир аналитичен и критичен: попадая в новую среду, вы сразу видите, что можно улучшить или исправить. Окружающие ценят вашу готовность помочь делом, а не просто словом, и видят в вас надежного специалиста. Вы можете казаться несколько сухим или сдержанным, так как предпочитаете контролировать свои эмоции.",
       "Весы": "Асцендент в Весах дарует вам врожденное обаяние, грацию и стремление к гармонии в любом взаимодействии. Вы производите впечатление человека приятного, вежливого и дипломатичного, с которым легко договориться. Ваша главная стратегия — избегать конфликтов, сглаживать острые углы и нравиться окружающим. Вы обладаете утонченным вкусом и эстетическим восприятием, что часто отражается в вашей внешности и манерах.",
       "Скорпион": "Вы обладаете магнетическим, пронзительным взглядом и мощной скрытой энергетикой, которую чувствуют все вокруг. Восходящий Скорпион создает вокруг вас ауру тайны, силы и непроницаемости, что вызывает у людей либо уважение, либо опаску. Вы никогда не раскрываетесь сразу, предпочитая сначала просканировать собеседника и ситуацию на предмет опасности. Окружающие видят в вас человека волевого, способного выдержать любые кризисы.",

  // ============================================
  // === MATH LOGIC (Core) ===

  const signs = ["Овен", "Телец", "Близнецы", "Рак", "Лев", "Дева", "Весы", "Скорпион", "Стрелец", "Козерог", "Водолей", "Рыбы"];
  const romanHouses = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

  function normalize(angle) { let r = angle % 360; return r < 0 ? r + 360 : r; }
  function toDMS(deg) { const d = Math.floor(deg); const m = Math.floor((deg - d) * 60); const s = Math.round(((deg - d) * 60 - m) * 60); return `${d}°${m<10?'0'+m:m}'${s<10?'0'+s:s}"`; }
  function getSignInfo(lon) { let norm = normalize(lon); const idx = Math.floor(norm / 30); return { name: signs[idx], degree: norm % 30, fullDeg: norm }; }

  function calcPorphyryFallback(asc, mc) {
      let houses = new Array(13);
      houses[1] = asc; houses[10] = mc; houses[7] = normalize(asc + 180); houses[4] = normalize(mc + 180);
      let diff = normalize(houses[4] - houses[1]) / 3; houses[2] = normalize(houses[1] + diff); houses[3] = normalize(houses[2] + diff);
      diff = normalize(houses[7] - houses[4]) / 3; houses[5] = normalize(houses[4] + diff); houses[6] = normalize(houses[5] + diff);
      diff = normalize(houses[10] - houses[7]) / 3; houses[8] = normalize(houses[7] + diff); houses[9] = normalize(houses[8] + diff);
      diff = normalize(houses[1] - houses[10]) / 3; houses[11] = normalize(houses[10] + diff); houses[12] = normalize(houses[11] + diff);
      return houses;
  }
  function calcPlacidusHouses(ramcRad, epsRad, latRad) {
      const R2D = 180.0 / Math.PI; const D2R = Math.PI / 180.0;
      let mcRad = Math.atan2(Math.sin(ramcRad), Math.cos(ramcRad) * Math.cos(epsRad));
      let mcDeg = normalize(mcRad * R2D);
      let ascRad = Math.atan2(Math.cos(ramcRad), -(Math.tan(latRad) * Math.sin(epsRad) + Math.sin(ramcRad) * Math.cos(epsRad)));
      let ascDeg = normalize(ascRad * R2D);
      if (Math.abs(latRad * R2D) >= 66.0) return calcPorphyryFallback(ascDeg, mcDeg);
      let houses = new Array(13);
      houses[1] = ascDeg; houses[10] = mcDeg; houses[4] = normalize(mcDeg + 180); houses[7] = normalize(ascDeg + 180);
      const calculateCusp = (angleFromMC) => {
           const offset = angleFromMC * D2R; let r = ramcRad + offset; 
           for(let i=0; i<10; i++) {
               let sinDecl = Math.sin(epsRad) * Math.sin(r);
               if (sinDecl > 1) sinDecl = 1; if (sinDecl < -1) sinDecl = -1;
               let decl = Math.asin(sinDecl);
               let tanL_tanD = Math.tan(latRad) * Math.tan(decl);
               if (Math.abs(tanL_tanD) > 1) tanL_tanD = Math.sign(tanL_tanD);
               let ad = Math.asin(tanL_tanD); 
               let f = 1.0;
               if (angleFromMC === 30 || angleFromMC === 150) f = 1.0/3.0;
               if (angleFromMC === 60 || angleFromMC === 120) f = 2.0/3.0;
               r = ramcRad + offset + f * ad;
           }
           let lon = Math.atan2( Math.sin(r) / Math.cos(epsRad), Math.cos(r) );
           return normalize(lon * R2D);
      };
      houses[11] = calculateCusp(30); houses[12] = calculateCusp(60); houses[2] = calculateCusp(120); houses[3] = calculateCusp(150);
      houses[5] = normalize(houses[11] + 180); houses[6] = normalize(houses[12] + 180); houses[8] = normalize(houses[2] + 180); houses[9] = normalize(houses[3] + 180);
      return houses;
  }

  function calculateChart() {
    const dateVal = document.getElementById('birthDate').value;
    const timeVal = document.getElementById('birthTime').value;
    let lat = parseFloat(document.getElementById('lat').value);
    let lngInput = parseFloat(document.getElementById('lng').value);
    const lngForEngine = -lngInput; 
    const utc = parseFloat(document.getElementById('utcOffset').value);
    const name = document.getElementById('userName').value || "Гость";

    if (!dateVal || !timeVal || isNaN(lat) || isNaN(lngInput)) { alert("Проверьте координаты."); return; }

    const [y, m, d] = dateVal.split('-').map(Number);
    const [hr, min] = timeVal.split(':').map(Number);
    const dateObj = new Date(Date.UTC(y, m - 1, d, hr - utc, min));
    const astroTime = Astronomy.MakeTime(dateObj);
    const observer = new Astronomy.Observer(lat, lngForEngine, 0);

    const T = (astroTime.ut - 2451545.0) / 36525.0;
    const epsDeg = 23.43929111 - (46.8150 / 3600.0) * T;
    const epsRad = epsDeg * Math.PI / 180;
    const gmst = Astronomy.SiderealTime(astroTime); 
    const lst = (gmst + lngInput / 15.0 + 24) % 24; 
    const ramcRad = lst * 15 * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    const houses = calcPlacidusHouses(ramcRad, epsRad, latRad);
    const ascInf = getSignInfo(houses[1]);
    const mcInf = getSignInfo(houses[10]);

    document.getElementById('resName').textContent = name;
    document.getElementById('ascResult').innerHTML = `${ascInf.name}<br><span style="font-size:12px; opacity:0.7">${toDMS(ascInf.degree)}</span>`;
    document.getElementById('mcResult').innerHTML = `${mcInf.name}<br><span style="font-size:12px; opacity:0.7">${toDMS(mcInf.degree)}</span>`;

    function getHouseNumber(deg, houses) {
        for(let i=1; i<=12; i++) {
             let s = houses[i]; let e = houses[i+1] || houses[1];
             let diff = normalize(deg - s); let span = normalize(e - s);
             if(diff >= 0 && diff < span) return i;
        } return 1;
    }

    let htmlPlanets = "";
    let interpData = [];
    const mainBodies = [
      { k: "Sun", name: "Солнце" }, { k: "Moon", name: "Луна" },
      { k: "Mercury", name: "Меркурий" }, { k: "Venus", name: "Венера" },
      { k: "Mars", name: "Марс" }, { k: "Jupiter", name: "Юпитер" },
      { k: "Saturn", name: "Сатурн" }, { k: "Uranus", name: "Уран" },
      { k: "Neptune", name: "Нептун" }, { k: "Pluto", name: "Плутон" }
    ];

    mainBodies.forEach(b => {
      const vec = Astronomy.GeoVector(Astronomy.Body[b.k], astroTime, true);
      const ecl = Astronomy.Ecliptic(vec);
      const vecPrev = Astronomy.GeoVector(Astronomy.Body[b.k], Astronomy.MakeTime(new Date(dateObj.getTime() - 3600000)), true);
      const eclPrev = Astronomy.Ecliptic(vecPrev);
      let speed = ecl.elon - eclPrev.elon; if (speed < -300) speed += 360; else if (speed > 300) speed -= 360;
      const isRetro = speed < 0;
      const inf = getSignInfo(ecl.elon);
      const hNum = getHouseNumber(ecl.elon, houses);

      interpData.push({ key: b.k, name: b.name, sign: inf.name, house: hNum });

      htmlPlanets += `<tr><td class="planet-icon">${b.name}</td><td>${inf.name}</td><td class="sign-val">${toDMS(inf.degree)}</td><td style="color:#e5534b; font-size:11px; text-align:center;">${isRetro ? "R" : ""}</td><td style="font-weight:bold; color:var(--accent)">${hNum} дом</td></tr>`;
    });

    document.getElementById('planetsBody').innerHTML = htmlPlanets;

    let housesHtml = "";
    for(let i=1; i<=12; i++) {
        const hInf = getSignInfo(houses[i]);
        let label = romanHouses[i];
        if(i===1) label += " (ASC)"; if(i===4) label += " (IC)"; if(i===7) label += " (DSC)"; if(i===10) label += " (MC)";
        housesHtml += `<tr><td style="font-weight:bold; color:var(--accent)">${label}</td><td>${hInf.name}</td><td class="sign-val">${toDMS(hInf.degree)}</td></tr>`;
    }
    document.getElementById('housesBody').innerHTML = housesHtml;

    // GENERATE INTERPRETATIONS
    renderInterpretations(ascInf.name, mcInf.name, interpData);

    document.getElementById('results-area').style.display = 'block';
    document.getElementById('results-area').scrollIntoView({behavior: "smooth"});
  }

    const ascText = generateText('asc', null, ascName, 1);

        <div class="interp-text">${ascText}</div>

    let plHtml = "";
    planets.forEach(p => {
        let fullText = generateText('planet', p.key, p.sign, p.house);

        plHtml += `
          <div class="interp-card">
            <div class="interp-header"><span class="interp-title">${p.name} в знаке ${p.sign}</span></div>
            <div class="interp-text">${fullText}</div>
          </div>
        `;
    });
    document.getElementById('interp-planets').innerHTML = plHtml;
  }
  
  // --- AUTO TIMEZONE LOGIC ---
  let currentIanaZone = null;

  const cityInput = document.getElementById('citySearch');
  const resultsBox = document.getElementById('searchResults');
  const tzInfoDiv = document.getElementById('tzInfo');
  let debounceTimer;

  cityInput.addEventListener('input', function() {
    const query = this.value.trim(); clearTimeout(debounceTimer);
    if (query.length < 3) { resultsBox.style.display = 'none'; return; }
    debounceTimer = setTimeout(() => { searchCity(query); }, 600);
  });

  async function searchCity(query) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=ru&limit=5`);
      const data = await res.json();
      resultsBox.innerHTML = '';
      if (!data.length) { resultsBox.style.display = 'none'; return; }
      data.forEach(place => {
        const div = document.createElement('div'); div.className = 'search-item';
        div.innerHTML = `<strong>${place.name}</strong><br><span style="opacity:0.6; font-size:11px">${place.display_name}</span>`;
        div.onclick = () => {
          cityInput.value = place.name;
          const lat = parseFloat(place.lat).toFixed(4);
          const lng = parseFloat(place.lon).toFixed(4);
          document.getElementById('lat').value = lat;
          document.getElementById('lng').value = lng;
          resultsBox.style.display = 'none';
          
          // Trigger Timezone Detection
          detectTimezone(lat, lng);
        }; resultsBox.appendChild(div);
      }); resultsBox.style.display = 'block';
    } catch (e) { console.error(e); }
  }

  // 1. Get Timezone ID from Open-Meteo (Fast & Free)
  async function detectTimezone(lat, lng) {
      try {
          tzInfoDiv.style.display = 'block';
          tzInfoDiv.textContent = "Определяем часовой пояс...";
          
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&timezone=auto`);
          const data = await res.json();
          
          if(data.timezone) {
              currentIanaZone = data.timezone;
              updateTimezoneIfPossible();
          }
      } catch (e) {
          console.error("Timezone fetch error", e);
          tzInfoDiv.textContent = "Не удалось определить пояс авто.";
      }
  }

  // 2. Calculate Offset for Specific Date using Browser Intl API
  function updateTimezoneIfPossible() {
      if(!currentIanaZone) return;
      
      const dateStr = document.getElementById('birthDate').value;
      if(!dateStr) return;
      
      const [y, m, d] = dateStr.split('-').map(Number);
      const timeStr = document.getElementById('birthTime').value || "12:00";
      const [hr, min] = timeStr.split(':').map(Number);

      try {
          // Create a date object in UTC with the same components as input (to treat it as "wall time")
          const utcDate = new Date(Date.UTC(y, m - 1, d, hr, min));
          
          // Format it to parts in the target timezone to see the offset string
          const fmt = new Intl.DateTimeFormat('en-US', {
                timeZone: currentIanaZone,
                timeZoneName: 'longOffset'
          });
          
          const parts = fmt.formatToParts(utcDate);
          const offsetPart = parts.find(p => p.type === 'timeZoneName'); // e.g. "GMT+05:00"
          
          if(offsetPart) {
              const str = offsetPart.value.replace('GMT', '');
              const sign = str.includes('-') ? -1 : 1;
              const [h, minutes] = str.replace(/[+-]/, '').split(':').map(Number);
              const offset = sign * (h + (minutes || 0) / 60);
              
              document.getElementById('utcOffset').value = offset;
              tzInfoDiv.innerHTML = `Пояс: <b>${currentIanaZone}</b><br>На дату рождения: <b>UTC${offset >= 0 ? '+' : ''}${offset}</b>`;
          }
      } catch (e) {
          console.error("Offset calc error", e);
      }
  }

  document.addEventListener('click', e => {
    if (!cityInput.contains(e.target) && !resultsBox.contains(e.target)) resultsBox.style.display = 'none';
  });
</script>
