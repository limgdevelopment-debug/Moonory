<script type="module">
  import SwissEph from 'https://cdn.jsdelivr.net/gh/prolaxu/swisseph-wasm@main/src/swisseph.js';

  // --- инициализация Swiss Ephemeris ---
  const swe = new SwissEph();
  await swe.initSwissEph();

  // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
  const rad = d => d * Math.PI / 180;
  const norm = x => (x % 360 + 360) % 360;
  const zodiac = ['Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'];

  const signOf = lo => {
    const n = norm(lo);
    return { sign:zodiac[Math.floor(n/30)], degree:(n%30).toFixed(2) };
  };

  // Перевод локального времени в UT-часы
  function toUtcHour(localHour, localMinute, tzOffset) {
    const local = localHour + localMinute / 60;
    return local - tzOffset;
  }

  // ===== ГЕОКОДЕР (оставляем как был) =====
  async function geocodeCity(city){
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=ru&q='
                + encodeURIComponent(city);
    const res = await fetch(url, { headers:{'Accept':'application/json'} });
    if(!res.ok) throw new Error('Сервис геокодирования недоступен. Попробуйте позже.');
    const data = await res.json();
    if(!data.length) throw new Error('Город не найден. Попробуйте указать страну или регион.');
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  }

  async function handleGeoButton(){
    const placeInput = document.getElementById('place');
    const btn = document.getElementById('geoBtn');
    const latInput = document.getElementById('lat');
    const lonInput = document.getElementById('lon');

    const city = placeInput.value.trim();
    if(!city){
      alert('Введите название города, например: Москва или Сибай.');
      return;
    }

    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Определяем координаты...';

    try{
      const {lat, lon} = await geocodeCity(city);
      latInput.value = lat.toFixed(4);
      lonInput.value = lon.toFixed(4);
    }catch(err){
      alert(err.message || 'Не удалось определить координаты по этому городу.');
    }finally{
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  // ===== РЕНДЕР (твои функции почти без изменений) =====
  const ASPECTS = [
    {name:'Соединение', angle:0,   orb:8},
    {name:'Оппозиция',  angle:180, orb:8},
    {name:'Тригон',     angle:120, orb:6},
    {name:'Квадрат',    angle:90,  orb:6},
    {name:'Секстиль',   angle:60,  orb:4}
  ];

  function aspectBetween(lo1, lo2){
    const d = Math.abs(norm(lo1-lo2));
    const delta = d > 180 ? 360 - d : d;
    for(const a of ASPECTS){
      if(Math.abs(delta - a.angle) <= a.orb){
        return {name:a.name, delta:(delta - a.angle).toFixed(2)};
      }
    }
    return null;
  }

  function renderPositions(rows){
    const table = document.getElementById('table');
    table.innerHTML =
      '<tr><th>Объект</th><th>Долгота</th><th>Знак</th><th>Дом</th></tr>' +
      rows.map(r=>`<tr><td>${r.name}</td><td>${r.long.toFixed(2)}°</td><td>${r.sign.sign} ${r.sign.degree}°</td><td>${r.house ? r.house + ' дом' : '—'}</td></tr>`).join('');
  }

  function renderAspects(list){
    const tbl = document.getElementById('aspects');
    if(!list.length){
      tbl.innerHTML =
        '<tr><th>Аспект</th><th>Между</th><th>Δ</th></tr>' +
        '<tr><td colspan="3">Нет мажорных аспектов в заданных орбисах</td></tr>';
      return;
    }
    tbl.innerHTML =
      '<tr><th>Аспект</th><th>Между</th><th>Δ</th></tr>' +
      list.map(a=>`<tr><td>${a.name}</td><td>${a.p1} — ${a.p2}</td><td>${a.delta}°</td></tr>`).join('');
  }

  function drawWheel(canvas, items, houses){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const Cx = W/2, Cy = H/2;
    const R = Math.min(W,H)/2 - 30;

    ctx.clearRect(0,0,W,H);

    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    for(const r of [R, R*0.82, R*0.6]){
      ctx.beginPath();
      ctx.arc(Cx,Cy,r,0,Math.PI*2);
      ctx.stroke();
    }

    for(let i=0;i<12;i++){
      const ang = rad(-90 + i*30);
      const x1 = Cx + Math.cos(ang)*R;
      const y1 = Cy + Math.sin(ang)*R;
      const x2 = Cx + Math.cos(ang)*R*0.6;
      const y2 = Cy + Math.sin(ang)*R*0.6;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();

      const tx = Cx + Math.cos(ang-0.1)*R*0.9;
      const ty = Cy + Math.sin(ang-0.1)*R*0.9;
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.font='14px ui-sans-serif';
      ctx.textAlign='center';
      ctx.fillText(zodiac[i], tx, ty);
    }

    if(houses){
      ctx.strokeStyle='rgba(198,169,142,.7)';
      houses.forEach(h=>{
        const a = rad(-90 + h);
        const x = Cx + Math.cos(a)*R*0.82;
        const y = Cy + Math.sin(a)*R*0.82;
        ctx.beginPath();
        ctx.moveTo(Cx,Cy);
        ctx.lineTo(x,y);
        ctx.stroke();
      });
    }

    for(const it of items){
      const a = rad(-90 + it.long);
      const r = R*0.7;
      const x = Cx + Math.cos(a)*r;
      const y = Cy + Math.sin(a)*r;
      ctx.fillStyle='rgba(198,169,142,0.95)';
      ctx.beginPath();
      ctx.arc(x,y,5,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,240,235,.95)';
      ctx.font='12px ui-sans-serif';
      ctx.textAlign='left';
      ctx.fillText(it.name, x+8, y-6);
    }
  }

  // --- тут оставь свои функции renderHousesTable / renderInterpretations (они ок) ---
  // (их можно просто перенести в этот же скрипт без изменений)

  // ===== ОБРАБОТЧИКИ =====
  document.getElementById('geoBtn').addEventListener('click', handleGeoButton);

  document.getElementById('form').addEventListener('submit', async (e)=>{
    e.preventDefault();

    const d   = document.getElementById('birthDate').value;
    const t   = document.getElementById('birthTime').value;
    const tz  = parseFloat(document.getElementById('tz').value)||0;
    const lat = parseFloat(document.getElementById('lat').value||'0');
    const lon = parseFloat(document.getElementById('lon').value||'0');

    if(!d || !t){
      alert('Укажите дату и время рождения');
      return;
    }

    const [year, month, day] = d.split('-').map(Number);
    const [hh,mm] = t.split(':').map(Number);
    const utcHour = toUtcHour(hh, mm, tz);
    const jd = swe.julday(year, month, day, utcHour);

    // --- планеты через SwissEph ---
    const planetDefs = [
      { name:'Солнце',   id:swe.SE_SUN },
      { name:'Луна',     id:swe.SE_MOON },
      { name:'Меркурий', id:swe.SE_MERCURY },
      { name:'Венера',   id:swe.SE_VENUS },
      { name:'Марс',     id:swe.SE_MARS },
      { name:'Юпитер',   id:swe.SE_JUPITER },
      { name:'Сатурн',   id:swe.SE_SATURN },
      { name:'Уран',     id:swe.SE_URANUS },
      { name:'Нептун',   id:swe.SE_NEPTUNE },
      { name:'Плутон',   id:swe.SE_PLUTO }
    ];

    const positions = [];

    for (const p of planetDefs){
      const res = swe.calc_ut(jd, p.id, swe.SEFLG_SWIEPH);
      const lonDeg = res[0];
      positions.push({
        name: p.name,
        long: lonDeg,
        sign: signOf(lonDeg)
      });
    }

    // --- дома Placidus ---
    let housesRes;
    if (typeof swe.houses === 'function'){
      housesRes = swe.houses(jd, lat, lon, 'P');
    } else if (typeof swe.houses_ex === 'function'){
      housesRes = swe.houses_ex(jd, lat, lon, 'P');
    }

    let houses = null;
    if (housesRes && housesRes.cusps){
      // cusps[1..12]
      houses = [];
      for (let i=1;i<=12;i++){
        houses.push(housesRes.cusps[i]);
      }
    }

    // --- дом для каждой планеты ---
    function findHouseFor(longitude) {
      if (!houses) return null;
      let lon = norm(longitude);
      for (let i=0;i<12;i++){
        let c1 = norm(houses[i]);
        let c2 = norm(houses[(i+1)%12]);
        if (c2 < c1) c2 += 360;
        let l = lon;
        if (l < c1) l += 360;
        if (l >= c1 && l < c2) return i+1;
      }
      return null;
    }

    positions.forEach(p=>{
      p.house = findHouseFor(p.long);
    });

    // --- аспекты ---
    const aspects = [];
    for(let i=0;i<positions.length;i++){
      for(let j=i+1;j<positions.length;j++){
        const a = aspectBetween(positions[i].long, positions[j].long);
        if(a) aspects.push({p1:positions[i].name,p2:positions[j].name,name:a.name,delta:a.delta});
      }
    }

    renderPositions(positions);
    renderAspects(aspects);
    drawWheel(document.getElementById('wheel'), positions, houses);
    renderHousesTable(houses);
    renderInterpretations(positions, houses);
  });
</script>
